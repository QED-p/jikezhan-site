# 容器内 nginx 配置：只做静态服务（TLS/证书由宿主宝塔 nginx 负责）
# root 指向 /srv/current —— 宿主把整个发布根挂到 /srv，nginx 每次打开文件都会解析 symlink，
# 因此部署侧的原子切换（ln -sfn）即时生效。
server {
    listen 80;
    server_name _;

    root /srv/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm font/woff2;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
